<!DOCTYPE html>
<html>
<head>
    <title>My Wholesalers</title>
</head>

<body>

<h1>My Wholesalers</h1>

{% if wholesalers %}

    {% for wholesaler in wholesalers %}

        <div>
            <h2>{{ wholesaler.business_name }}</h2>

            <p>
                Phone: {{ wholesaler.phone }}
            </p>

            <p>
                Address: {{ wholesaler.address }}
            </p>

            <a href="{% url 'wholesaler_products' wholesaler.id %}">
                View Products
            </a>
        </div>

        <hr>

    {% endfor %}

{% else %}

    <p>
        You are not connected to any wholesaler yet.
    </p>

{% endif %}

<br>

<a href="{% url 'dashboard' %}">
    Back to Dashboard
</a>

</body>
</html>
