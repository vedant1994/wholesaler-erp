<!DOCTYPE html>
<html>
<head>
    <title>Delete Stock</title>
</head>
<body>

<h1>Delete Stock</h1>

<p>
    Are you sure you want to delete
    <strong>{{ stock.name }}</strong>?
</p>

<form method="POST">

    {% csrf_token %}

    <button type="submit">
        Yes, Delete
    </button>

</form>

<br>

<a href="{% url 'stock_list' %}">
    Cancel
</a>

</body>
</html>
