{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Wholesaler ERP</title>
  <meta name="description" content="Login to your Wholesaler ERP account.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/styles.css' %}">
  <style>
    body { background: linear-gradient(135deg, #0f172a 0%, #1e3a5f 60%, #0f172a 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .auth-wrapper { width: 100%; max-width: 420px; padding: 24px; }
    .auth-logo { text-align: center; margin-bottom: 32px; }
    .auth-logo .logo-mark { width: 56px; height: 56px; background: #2563eb; border-radius: 16px; display: inline-flex; align-items: center; justify-content: center; font-size: 24px; font-weight: 700; color: #fff; margin-bottom: 12px; box-shadow: 0 8px 24px rgba(37,99,235,0.4); }
    .auth-logo h1 { font-size: 22px; font-weight: 700; color: #fff; }
    .auth-logo p { font-size: 13px; color: #94a3b8; margin-top: 4px; }
    .auth-card { background: #fff; border-radius: 20px; padding: 36px; box-shadow: 0 24px 64px rgba(0,0,0,0.3); }
    .auth-card h2 { font-size: 22px; font-weight: 700; color: #111827; margin-bottom: 6px; }
    .auth-card .subtitle { font-size: 13px; color: #6b7280; margin-bottom: 28px; }
    .auth-error { background: #fef2f2; border: 1px solid #fecaca; border-radius: 10px; padding: 12px 16px; font-size: 13px; color: #b91c1c; margin-bottom: 20px; display: flex; gap: 8px; align-items: center; }
    .auth-footer { text-align: center; margin-top: 24px; font-size: 13px; color: #6b7280; }
    .auth-footer a { color: #2563eb; font-weight: 500; }
    .input-group { position: relative; }
    .input-group .input-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: #9ca3af; width: 18px; height: 18px; }
    .input-group .form-input { padding-left: 40px; }
    .forgot-link { font-size: 12px; color: #6b7280; float: right; }
    .forgot-link:hover { color: #2563eb; }
    .divider { text-align: center; color: #9ca3af; font-size: 12px; margin: 20px 0; position: relative; }
    .divider::before, .divider::after { content: ''; position: absolute; top: 50%; width: 40%; height: 1px; background: #e5e7eb; }
    .divider::before { left: 0; } .divider::after { right: 0; }
  </style>
</head>
<body>

<div class="auth-wrapper">
  <div class="auth-logo">
    <div class="logo-mark">E</div>
    <h1>WholesaleERP</h1>
    <p>B2B Wholesale Management System</p>
  </div>

  <div class="auth-card">
    <h2>Welcome back</h2>
    <p class="subtitle">Sign in to your business account</p>

    {% if error %}
      <div class="auth-error">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
        {{ error }}
      </div>
    {% endif %}

    <form method="POST" class="primary-form">
      {% csrf_token %}

      <div class="form-group">
        <label class="form-label" for="id_username">Username</label>
        <div class="input-group">
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
          </svg>
          <input id="id_username" class="form-input" type="text" name="username" placeholder="Enter your username" required autofocus>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="id_password">
          Password
          <a href="#" class="forgot-link">Forgot password?</a>
        </label>
        <div class="input-group">
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
          <input id="id_password" class="form-input" type="password" name="password" placeholder="Enter your password" required>
        </div>
      </div>

      <button type="submit" class="btn btn-primary w-full btn-lg" style="justify-content:center;">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
          <polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/>
        </svg>
        Sign In
      </button>
    </form>

    <div class="auth-footer">
      Don't have an account?
      <a href="{% url 'register' %}">Create one free</a>
    </div>
  </div>
</div>

</body>
</html>
