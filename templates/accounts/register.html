{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register — Wholesaler ERP</title>
  <meta name="description" content="Create your Wholesaler ERP account.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/styles.css' %}">
  <style>
    body { background: linear-gradient(135deg, #0f172a 0%, #1e3a5f 60%, #0f172a 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px 0; }
    .auth-wrapper { width: 100%; max-width: 460px; padding: 24px; }
    .auth-logo { text-align: center; margin-bottom: 28px; }
    .auth-logo .logo-mark { width: 56px; height: 56px; background: #2563eb; border-radius: 16px; display: inline-flex; align-items: center; justify-content: center; font-size: 24px; font-weight: 700; color: #fff; margin-bottom: 12px; box-shadow: 0 8px 24px rgba(37,99,235,0.4); }
    .auth-logo h1 { font-size: 22px; font-weight: 700; color: #fff; }
    .auth-logo p { font-size: 13px; color: #94a3b8; margin-top: 4px; }
    .auth-card { background: #fff; border-radius: 20px; padding: 36px; box-shadow: 0 24px 64px rgba(0,0,0,0.3); }
    .auth-card h2 { font-size: 22px; font-weight: 700; color: #111827; margin-bottom: 6px; }
    .auth-card .subtitle { font-size: 13px; color: #6b7280; margin-bottom: 24px; }
    .auth-footer { text-align: center; margin-top: 24px; font-size: 13px; color: #6b7280; }
    .auth-footer a { color: #2563eb; font-weight: 500; }
  </style>
</head>
<body>

<div class="auth-wrapper">
  <div class="auth-logo">
    <div class="logo-mark">E</div>
    <h1>WholesaleERP</h1>
    <p>B2B Wholesale Management System</p>
  </div>

  <div class="auth-card">
    <h2>Create Account</h2>
    <p class="subtitle">Join as a Wholesaler or Retailer</p>

    <form method="POST" class="primary-form">
      {% csrf_token %}

      {% for field in form %}
        <div class="form-group">
          <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
          {{ field }}
          {% if field.errors %}
            <p class="form-error" style="color: #dc2626; font-size: 12px; margin-top: 4px;">{{ field.errors.0 }}</p>
          {% endif %}
        </div>
      {% endfor %}

      <button type="submit" class="btn btn-primary w-full btn-lg" style="justify-content:center; margin-top: 12px;">
        Register Account
      </button>
    </form>

    <div class="auth-footer">
      Already have an account?
      <a href="{% url 'login' %}">Log in</a>
    </div>
  </div>
</div>

</body>
</html>
